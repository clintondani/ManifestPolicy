<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – ManifestPolicy</title>
  <link rel="stylesheet" href="style_new.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card glass-card">
      <!-- Logo Section -->
      <div class="auth-logo-section">
        <div class="logo-icon">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L2 7V12C2 17.55 6.84 22.74 12 24C17.16 22.74 22 17.55 22 12V7L12 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M9 12L11 14L15 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h1 class="auth-title">ManifestPolicy</h1>
        <p class="auth-subtitle">Privacy Policy Compliance Scanner</p>
      </div>

      <!-- Auth Form -->
      <form id="authForm" class="auth-form" onsubmit="handleAuth(event)">
        <div class="input-group">
          <label for="username" class="input-label">Username</label>
          <input 
            type="text" 
            id="username" 
            class="input-field" 
            placeholder="Enter your username"
            required
            autocomplete="username"
            minlength="3"
          />
          <div class="input-hint" style="display: flex; align-items: center; gap: 0.5rem; margin-top: 0.5rem; font-size: 0.75rem; color: var(--color-tertiary);">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <circle cx="12" cy="12" r="10" stroke-width="2"/>
              <line x1="12" y1="16" x2="12" y2="12" stroke-width="2"/>
              <line x1="12" y1="8" x2="12.01" y2="8" stroke-width="2"/>
            </svg>
            Minimum 3 characters
          </div>
        </div>

        <div class="input-group">
          <label for="password" class="input-label">Password</label>
          <div class="password-input-wrapper">
            <input 
              type="password" 
              id="password" 
              class="input-field password-field" 
              placeholder="Enter your password"
              required
              autocomplete="current-password"
              oninput="checkPasswordStrength()"
            />
            <button type="button" class="toggle-password" onclick="togglePassword()" aria-label="Toggle password visibility">
              <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke-width="2"/>
                <circle cx="12" cy="12" r="3" stroke-width="2"/>
              </svg>
            </button>
          </div>
          
          <!-- Password Strength Indicator -->
          <div id="passwordStrength" class="password-strength" style="display: none;">
            <div class="strength-bar">
              <div id="strengthBar" class="strength-bar-fill"></div>
            </div>
            <div class="strength-text">
              <span id="strengthLabel">Password strength: </span>
              <span id="strengthValue">-</span>
            </div>
            <ul id="strengthRequirements" class="strength-requirements">
              <li id="req-length" class="requirement">
                <svg class="req-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                  <circle cx="12" cy="12" r="10" stroke-width="2"/>
                </svg>
                At least 8 characters
              </li>
              <li id="req-uppercase" class="requirement">
                <svg class="req-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                  <circle cx="12" cy="12" r="10" stroke-width="2"/>
                </svg>
                One uppercase letter
              </li>
              <li id="req-lowercase" class="requirement">
                <svg class="req-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                  <circle cx="12" cy="12" r="10" stroke-width="2"/>
                </svg>
                One lowercase letter
              </li>
              <li id="req-number" class="requirement">
                <svg class="req-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                  <circle cx="12" cy="12" r="10" stroke-width="2"/>
                </svg>
                One number
              </li>
              <li id="req-special" class="requirement">
                <svg class="req-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                  <circle cx="12" cy="12" r="10" stroke-width="2"/>
                </svg>
                One special character (!@#$%^&*)
              </li>
            </ul>
          </div>
        </div>

        <div class="auth-actions">
          <button type="submit" class="btn-primary btn-lg" data-action="login">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" stroke-width="2"/>
              <polyline points="10 17 15 12 10 7" stroke-width="2"/>
              <line x1="15" y1="12" x2="3" y2="12" stroke-width="2"/>
            </svg>
            Login
          </button>
          
          <button type="button" class="btn-secondary btn-lg" onclick="switchToSignup()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" stroke-width="2"/>
              <circle cx="8.5" cy="7" r="4" stroke-width="2"/>
              <line x1="20" y1="8" x2="20" y2="14" stroke-width="2"/>
              <line x1="23" y1="11" x2="17" y2="11" stroke-width="2"/>
            </svg>
            Sign Up
          </button>
        </div>
      </form>

      <div class="auth-footer">
        <p class="auth-footer-text">
          Secure authentication powered by industry standards
        </p>
      </div>
    </div>

    <!-- Guest Access Button -->
    <div class="guest-access">
      <button class="btn-secondary" onclick="continueAsGuest()">
        Continue as Guest
      </button>
    </div>
  </div>

  <script>
    const backendUrl = "http://localhost:5000";
    let isSignupMode = false;

    // ===================================
    // PASSWORD STRENGTH CHECKER
    // ===================================

    function checkPasswordStrength() {
      const password = document.getElementById("password").value;
      const strengthContainer = document.getElementById("passwordStrength");
      const strengthBar = document.getElementById("strengthBar");
      const strengthValue = document.getElementById("strengthValue");
      
      // Only show strength checker in signup mode
      if (!isSignupMode) {
        strengthContainer.style.display = "none";
        return;
      }
      
      if (password.length === 0) {
        strengthContainer.style.display = "none";
        return;
      }
      
      strengthContainer.style.display = "block";
      
      // Check requirements
      const requirements = {
        length: password.length >= 8,
        uppercase: /[A-Z]/.test(password),
        lowercase: /[a-z]/.test(password),
        number: /[0-9]/.test(password),
        special: /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(password)
      };
      
      // Update requirement indicators
      updateRequirement('req-length', requirements.length);
      updateRequirement('req-uppercase', requirements.uppercase);
      updateRequirement('req-lowercase', requirements.lowercase);
      updateRequirement('req-number', requirements.number);
      updateRequirement('req-special', requirements.special);
      
      // Calculate strength
      const metRequirements = Object.values(requirements).filter(Boolean).length;
      let strength = 0;
      let strengthText = "";
      let strengthColor = "";
      
      if (metRequirements === 0) {
        strength = 0;
        strengthText = "Very Weak";
        strengthColor = "#f44336";
      } else if (metRequirements <= 2) {
        strength = 25;
        strengthText = "Weak";
        strengthColor = "#ff9800";
      } else if (metRequirements === 3) {
        strength = 50;
        strengthText = "Fair";
        strengthColor = "#ffc107";
      } else if (metRequirements === 4) {
        strength = 75;
        strengthText = "Good";
        strengthColor = "#8bc34a";
      } else {
        strength = 100;
        strengthText = "Strong";
        strengthColor = "#4caf50";
      }
      
      // Update UI
      strengthBar.style.width = strength + "%";
      strengthBar.style.backgroundColor = strengthColor;
      strengthValue.textContent = strengthText;
      strengthValue.style.color = strengthColor;
    }
    
    function updateRequirement(id, met) {
      const element = document.getElementById(id);
      if (met) {
        element.classList.add('met');
        element.querySelector('.req-icon').innerHTML = `
          <circle cx="12" cy="12" r="10" stroke-width="2" fill="none"/>
          <path d="M9 12l2 2 4-4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        `;
      } else {
        element.classList.remove('met');
        element.querySelector('.req-icon').innerHTML = `
          <circle cx="12" cy="12" r="10" stroke-width="2"/>
        `;
      }
    }

    // ===================================
    // TOGGLE PASSWORD VISIBILITY
    // ===================================

    function togglePassword() {
      const passwordInput = document.getElementById("password");
      const eyeIcon = document.getElementById("eyeIcon");
      
      if (passwordInput.type === "password") {
        passwordInput.type = "text";
        eyeIcon.innerHTML = `
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" stroke-width="2"/>
          <line x1="1" y1="1" x2="23" y2="23" stroke-width="2"/>
        `;
      } else {
        passwordInput.type = "password";
        eyeIcon.innerHTML = `
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke-width="2"/>
          <circle cx="12" cy="12" r="3" stroke-width="2"/>
        `;
      }
    }

    // ===================================
    // SWITCH BETWEEN LOGIN AND SIGNUP
    // ===================================

    function switchToSignup() {
      isSignupMode = true;
      const submitBtn = document.querySelector('[data-action="login"]');
      submitBtn.setAttribute('data-action', 'signup');
      submitBtn.innerHTML = `
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" stroke-width="2"/>
          <circle cx="8.5" cy="7" r="4" stroke-width="2"/>
          <line x1="20" y1="8" x2="20" y2="14" stroke-width="2"/>
          <line x1="23" y1="11" x2="17" y2="11" stroke-width="2"/>
        </svg>
        Create Account
      `;
      
      // Change secondary button to login
      const secondaryBtn = document.querySelector('.auth-actions .btn-secondary');
      secondaryBtn.textContent = 'Back to Login';
      secondaryBtn.onclick = switchToLogin;
      
      document.querySelector('.auth-subtitle').textContent = 'Create your account';
      
      // Show password strength checker
      checkPasswordStrength();
    }

    function switchToLogin() {
      isSignupMode = false;
      const submitBtn = document.querySelector('[data-action="signup"]');
      submitBtn.setAttribute('data-action', 'login');
      submitBtn.innerHTML = `
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" stroke-width="2"/>
          <polyline points="10 17 15 12 10 7" stroke-width="2"/>
          <line x1="15" y1="12" x2="3" y2="12" stroke-width="2"/>
        </svg>
        Login
      `;
      
      // Change secondary button to signup
      const secondaryBtn = document.querySelector('.auth-actions .btn-secondary');
      secondaryBtn.innerHTML = `
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" stroke-width="2"/>
          <circle cx="8.5" cy="7" r="4" stroke-width="2"/>
          <line x1="20" y1="8" x2="20" y2="14" stroke-width="2"/>
          <line x1="23" y1="11" x2="17" y2="11" stroke-width="2"/>
        </svg>
        Sign Up
      `;
      secondaryBtn.onclick = switchToSignup;
      
      document.querySelector('.auth-subtitle').textContent = 'Privacy Policy Compliance Scanner';
      
      // Hide password strength checker
      document.getElementById("passwordStrength").style.display = "none";
    }

    // ===================================
    // AUTHENTICATION HANDLER
    // ===================================

    async function handleAuth(event) {
      event.preventDefault();
      
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const action = isSignupMode ? 'signup' : 'login';

      if (!username || !password) {
        showNotification("Please fill in all fields", "warning");
        return;
      }

      // Username validation
      if (username.length < 3) {
        showNotification("Username must be at least 3 characters", "warning");
        return;
      }

      // Password validation for signup
      if (action === 'signup') {
        if (password.length < 8) {
          showNotification("Password must be at least 8 characters", "warning");
          return;
        }
        
        // Check if password meets requirements
        const requirements = {
          length: password.length >= 8,
          uppercase: /[A-Z]/.test(password),
          lowercase: /[a-z]/.test(password),
          number: /[0-9]/.test(password),
          special: /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(password)
        };
        
        const metRequirements = Object.values(requirements).filter(Boolean).length;
        
        if (metRequirements < 4) {
          showNotification("Password is too weak. Please meet at least 4 requirements.", "warning");
          return;
        }
      }

      try {
        const response = await fetch(`${backendUrl}/${action}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (response.ok) {
          if (action === 'login') {
            localStorage.setItem("username", username);
            showNotification("Login successful!", "success");
            setTimeout(() => {
              window.location.href = "index_new.html";
            }, 1000);
          } else {
            showNotification("Account created! Please login.", "success");
            switchToLogin();
            document.getElementById("authForm").reset();
          }
        } else {
          showNotification(data.error || `${action} failed`, "danger");
        }
      } catch (error) {
        console.error(`${action} error:`, error);
        showNotification("Connection failed. Please try again.", "danger");
      }
    }

    function continueAsGuest() {
      localStorage.removeItem("username");
      window.location.href = "index_new.html";
    }

    function showNotification(message, type = "info") {
      const notification = document.createElement("div");
      notification.className = `notification notification-${type}`;
      notification.style.cssText = `
        position: fixed;
        top: 20px;
        right: 20px;
        background: ${type === 'success' ? 'rgba(76, 175, 80, 0.9)' : 
                     type === 'warning' ? 'rgba(255, 152, 0, 0.9)' : 
                     type === 'danger' ? 'rgba(244, 67, 54, 0.9)' : 
                     'rgba(33, 150, 243, 0.9)'};
        color: white;
        padding: 16px 24px;
        border-radius: 10px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        z-index: 10000;
        font-weight: 500;
        animation: slideIn 0.3s ease;
      `;
      notification.textContent = message;
      
      document.body.appendChild(notification);
      
      setTimeout(() => {
        notification.style.animation = "slideOut 0.3s ease";
        setTimeout(() => notification.remove(), 300);
      }, 4000);
    }

    // Check if already logged in
    window.onload = () => {
      const username = localStorage.getItem("username");
      if (username) {
        window.location.href = "index_new.html";
      }
    };
  </script>

  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: var(--color-primary);
    }

    .auth-card {
      width: 100%;
      max-width: 440px;
      padding: 3rem;
    }

    .auth-logo-section {
      text-align: center;
      margin-bottom: 2rem;
    }

    .auth-logo-section .logo-icon {
      margin: 0 auto 1rem;
    }

    .auth-title {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--color-light);
      margin-bottom: 0.5rem;
    }

    .auth-subtitle {
      font-size: 0.875rem;
      color: var(--color-tertiary);
      font-weight: 500;
    }

    .auth-form {
      margin-bottom: 1.5rem;
    }

    .input-field {
      width: 100%;
      padding: 0.875rem 1rem;
      background: rgba(26, 18, 11, 0.6);
      border: 1px solid rgba(213, 206, 163, 0.2);
      border-radius: 10px;
      color: var(--color-light);
      font-family: var(--font-primary);
      font-size: 0.875rem;
      transition: all 0.2s ease;
    }

    .input-field:focus {
      outline: none;
      border-color: var(--color-tertiary);
      background: rgba(26, 18, 11, 0.8);
    }

    .input-field::placeholder {
      color: rgba(213, 206, 163, 0.5);
    }

    .auth-actions {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }

    .auth-footer {
      text-align: center;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(213, 206, 163, 0.15);
    }

    .auth-footer-text {
      font-size: 0.75rem;
      color: var(--color-tertiary);
    }

    .guest-access {
      margin-top: 1.5rem;
      text-align: center;
    }

    @keyframes slideIn {
      from {
        transform: translateX(400px);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }
    
    @keyframes slideOut {
      from {
        transform: translateX(0);
        opacity: 1;
      }
      to {
        transform: translateX(400px);
        opacity: 0;
      }
    }

    /* Password Input Wrapper */
    .password-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .password-field {
      padding-right: 3rem;
    }

    .toggle-password {
      position: absolute;
      right: 0.75rem;
      background: none;
      border: none;
      color: var(--color-tertiary);
      cursor: pointer;
      padding: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s ease;
    }

    .toggle-password:hover {
      color: var(--color-light);
    }

    /* Password Strength Indicator */
    .password-strength {
      margin-top: 1rem;
      padding: 1rem;
      background: rgba(26, 18, 11, 0.4);
      border-radius: 8px;
      border: 1px solid rgba(213, 206, 163, 0.15);
    }

    .strength-bar {
      width: 100%;
      height: 6px;
      background: rgba(213, 206, 163, 0.2);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 0.75rem;
    }

    .strength-bar-fill {
      height: 100%;
      width: 0%;
      transition: width 0.3s ease, background-color 0.3s ease;
      border-radius: 3px;
    }

    .strength-text {
      font-size: 0.875rem;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
    }

    .strength-text #strengthLabel {
      color: var(--color-tertiary);
    }

    .strength-text #strengthValue {
      font-weight: 600;
      margin-left: 0.25rem;
    }

    .strength-requirements {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .requirement {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8125rem;
      color: var(--color-tertiary);
      transition: color 0.2s ease;
    }

    .requirement .req-icon {
      flex-shrink: 0;
      stroke: var(--color-tertiary);
      transition: stroke 0.2s ease;
    }

    .requirement.met {
      color: #4caf50;
    }

    .requirement.met .req-icon {
      stroke: #4caf50;
    }

    /* Responsive design for login */
    @media (max-width: 576px) {
      .auth-container {
        padding: 1rem;
      }

      .auth-card {
        padding: 2rem 1.5rem;
      }

      .auth-title {
        font-size: 1.5rem;
      }

      .auth-subtitle {
        font-size: 0.8125rem;
      }

      .logo-icon {
        width: 48px;
        height: 48px;
      }

      .password-strength {
        padding: 0.75rem;
      }

      .strength-requirements {
        gap: 0.375rem;
      }

      .requirement {
        font-size: 0.75rem;
      }

      .toggle-password {
        right: 0.5rem;
      }
    }

    @media (max-width: 400px) {
      .auth-card {
        padding: 1.5rem 1rem;
      }

      .auth-logo-section .logo-icon {
        width: 44px;
        height: 44px;
      }

      .input-field {
        padding: 0.75rem;
        font-size: 0.875rem;
      }
    }

    /* Touch-friendly for mobile */
    @media (hover: none) and (pointer: coarse) {
      .input-field,
      button {
        min-height: 44px;
      }
    }
  </style>
</body>
</html>
